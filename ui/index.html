<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>MathBuddy — Parent View</title>
<style>
:root{--bg:#0d1117;--card:#161b22;--border:#2d333b;--fg:#e6edf3;--dim:#8b949e;
--green:#3fb950;--amber:#d29922;--red:#f85149;--blue:#58a6ff;--purple:#bc8cff}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--fg);font:15px/1.5 -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;padding:24px;max-width:980px;margin:auto}
h1{font-size:22px;display:flex;align-items:center;gap:10px}
h1 small{color:var(--dim);font-weight:400;font-size:13px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin:20px 0}
.card{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:14px 16px}
.card .v{font-size:26px;font-weight:700}.card .k{color:var(--dim);font-size:12px;text-transform:uppercase;letter-spacing:.05em}
.unit{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:14px 16px;margin-bottom:10px}
.unit h3{font-size:15px;display:flex;justify-content:space-between}
.unit h3 span.m{font-weight:600}
.stack{display:flex;height:10px;border-radius:5px;overflow:hidden;background:#21262d;margin:8px 0 6px}
.stack i{display:block;height:100%}
.u-understood{background:var(--green)}.u-hinted{background:var(--amber)}
.u-struggled{background:var(--red)}.u-gave-up{background:var(--purple)}
.meta{color:var(--dim);font-size:12px}
.weak{margin-top:4px;font-size:13px}.weak b{color:var(--red);font-weight:600}
h2{font-size:16px;margin:26px 0 10px;color:var(--fg)}
table{width:100%;border-collapse:collapse;font-size:13px}
td,th{padding:6px 8px;border-bottom:1px solid var(--border);text-align:left}
th{color:var(--dim);font-weight:500}
.r-understood{color:var(--green)}.r-hinted{color:var(--amber)}.r-struggled{color:var(--red)}.r-gave-up{color:var(--purple)}
.empty{background:var(--card);border:1px dashed var(--border);border-radius:10px;padding:40px;text-align:center;color:var(--dim)}
.days{display:flex;gap:3px;flex-wrap:wrap;margin-top:6px}
.day{width:14px;height:14px;border-radius:3px;background:#21262d}
footer{color:var(--dim);font-size:12px;margin-top:24px}
</style></head><body>
<h1>📈 MathBuddy <small>parent view — Open Up Math 3 (NC)</small></h1>
<div id="app">loading…</div>
<footer>read-only view of the tutor's own lesson log · auto-refreshes every 60s · nothing here is collected beyond lesson outcomes</footer>
<script>
const UNITS={1:"Congruence & Proof",2:"Circles",3:"Modeling w/ Geometry",4:"Functions & Inverses",5:"Exponential & Logarithmic",6:"Polynomial",7:"Rational Functions",8:"Periodic Behavior",9:"Modeling w/ Functions",10:"Statistics"};
const RES=["understood","hinted","struggled","gave-up"];
const ago=t=>{if(!t)return"—";const d=(Date.now()/1000-t)/3600;return d<1?Math.round(d*60)+" min ago":d<48?Math.round(d)+" h ago":Math.round(d/24)+" days ago"};
function render(s){
  if(!s.problemsTotal){document.getElementById("app").innerHTML=
    `<div class="empty"><h2 style="margin:0 0 8px">No logged problems yet 🌱</h2>
     As soon as he works problems with MathBuddy, per-unit mastery appears here.<br>
     <span class="meta">log: ${s.logFile}${s.logExists?"":" (not created yet)"}</span></div>`;return;}
  const m=s.currentUnit!=null?`Unit ${s.currentUnit} · ${UNITS[s.currentUnit]}`:"—";
  const days=Object.entries(s.byDay).map(([d,n])=>`<div class="day" title="${d}: ${n}" style="background:${n>6?"#3fb950":n>3?"#2ea04380":n>1?"#2ea04350":"#2ea04328"}"></div>`).join("");
  const units=s.units.map(u=>{
    const seg=RES.map(r=>`<i class="u-${r}" style="width:${100*u.counts[r]/u.total}%" title="${r}: ${u.counts[r]}"></i>`).join("");
    const mc=u.mastery>=70?"var(--green)":u.mastery>=45?"var(--amber)":"var(--red)";
    return `<div class="unit"><h3>Unit ${u.unit} — ${u.title}<span class="m" style="color:${mc}">${u.mastery}% mastery</span></h3>
      <div class="stack">${seg}</div>
      <div class="meta">${u.total} problems · ${u.counts.understood} understood · ${u.counts.hinted} hinted · ${u.counts.struggled} struggled · ${u.counts["gave-up"]} gave up</div>
      ${u.weakTopics.length?`<div class="weak">⚠️ needs review: <b>${u.weakTopics.join("</b>, <b>")}</b></div>`:""}</div>`;}).join("");
  const rows=s.recent.map(r=>`<tr><td>${new Date(r.ts*1000).toLocaleString([],{month:"short",day:"numeric",hour:"2-digit",minute:"2-digit"})}</td>
    <td>${r.lesson||r.unit||""}</td><td>${r.topic||r.problem||""}</td><td class="r-${r.result}">${r.result}</td></tr>`).join("");
  document.getElementById("app").innerHTML=`
   <div class="cards">
    <div class="card"><div class="v">${s.problemsTotal}</div><div class="k">problems total</div></div>
    <div class="card"><div class="v">${s.problemsThisWeek}</div><div class="k">this week</div></div>
    <div class="card"><div class="v" style="font-size:17px;padding-top:5px">${m}</div><div class="k">current unit</div></div>
    <div class="card"><div class="v" style="font-size:17px;padding-top:5px">${ago(s.lastActivity)}</div><div class="k">last session</div></div>
   </div>
   <div class="unit"><h3>Activity</h3><div class="days">${days}</div></div>
   <h2>Units</h2>${units}
   <h2>Recent problems</h2><table><tr><th>when</th><th>lesson</th><th>topic</th><th>result</th></tr>${rows}</table>`;
}
fetch("/api/summary").then(r=>r.json()).then(render).catch(e=>{
  document.getElementById("app").innerHTML=`<div class="empty">Dashboard server unreachable: ${e}</div>`;});
setInterval(()=>fetch("/api/summary").then(r=>r.json()).then(render),60000);
</script></body></html>
